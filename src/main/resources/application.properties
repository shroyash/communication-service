# Server Configuration
spring.application.name=communication-service
server.port=8006

# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.enabled=true
eureka.instance.prefer-ip-address=true

# Logging
logging.level.root=INFO

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/communication_service_db
spring.datasource.username=${DB_USERNAME}   
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.redis.host=redis
spring.redis.port=6379

# Error messages
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

logging.level.com.example.communication=DEBUG
logging.level.org.hibernate=DEBUG

spring.web.resources.static-locations=classpath:/uploads/images/
upload.path=uploads/profile/